<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:800px;height:800px;overflow:hidden;background:#05070B;font-family:Montserrat,Arial,sans-serif;position:relative}
  .glow{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,#1E90D6 0%,transparent 68%);opacity:.5;top:-200px;left:-120px;filter:blur(40px)}
  .glow2{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#C8102E 0%,transparent 70%);opacity:.55;bottom:-220px;right:-140px;filter:blur(40px)}
  .ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:520px;height:520px;border-radius:50%;border:1px solid rgba(191,221,245,.35)}
  .ring.b{width:400px;height:400px;border-style:dashed}
  .kicker{position:absolute;top:56px;left:60px;font-size:14px;letter-spacing:6px;color:#BFDDF5}
  .title{position:absolute;left:60px;right:60px;bottom:150px;font:400 150px/.86 Anton,Impact,sans-serif;letter-spacing:2px;color:#E8EAEE;text-shadow:0 8px 0 rgba(0,0,0,.5)}
  .sub{position:absolute;left:60px;bottom:96px;font-size:15px;letter-spacing:3px;color:#BFDDF5}
  .tag{position:absolute;right:60px;top:56px;font-size:12px;letter-spacing:2px;color:#8B94A1;border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:999px}
  .node{position:absolute;width:12px;height:12px;border-radius:50%;background:#BFDDF5;box-shadow:0 0 16px #1E90D6}
  .line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,#1E90D6,transparent)}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="ring"></div>
  <div class="ring b"></div>
  <div class="line" style="top:440px;left:120px;width:560px"></div>
  <div class="node" style="top:434px;left:110px"></div>
  <div class="node" style="top:434px;left:672px"></div>
  <div class="kicker">CONTOH DESAIN</div>
  <div class="tag">POSTER · 2026</div>
  <div class="title">DESAIN<br>BERTEMU<br>TEKNOLOGI</div>
  <div class="sub">GANTI DENGAN KARYA ASLI</div>
</body>
</html>
