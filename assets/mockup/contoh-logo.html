<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:800px;height:800px;overflow:hidden;background:#F4F7FB;font-family:Montserrat,Arial,sans-serif;position:relative;display:grid;place-items:center}
  .card{width:560px;height:560px;border-radius:36px;background:#0B2A44;position:relative;display:grid;place-items:center;box-shadow:0 20px 50px rgba(11,42,68,.25)}
  svg{width:360px;height:360px}
  .word{position:absolute;bottom:56px;left:0;right:0;text-align:center;font:600 22px Oswald,Arial,sans-serif;letter-spacing:6px;color:#BFDDF5}
  .note{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:3px;color:#55657A}
</style>
</head>
<body>
  <div class="note">CONTOH LOGO · GANTI DENGAN KARYA ASLI</div>
  <div class="card">
    <svg viewBox="0 0 360 360" aria-hidden="true">
      <polygon points="180,40 300,110 300,250 180,320 60,250 60,110" fill="none" stroke="#1E90D6" stroke-width="10" stroke-linejoin="round"/>
      <path d="M120 130 H180 V230 M180 180 H240" fill="none" stroke="#E8EAEE" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="130" r="9" fill="#BFDDF5"/>
      <circle cx="240" cy="180" r="9" fill="#BFDDF5"/>
      <circle cx="180" cy="230" r="9" fill="#BFDDF5"/>
      <path d="M60 110 L120 130 M300 110 L240 180" stroke="#1E90D6" stroke-width="3" opacity=".7"/>
    </svg>
    <div class="word">NETWORK DESIGN</div>
  </div>
</body>
</html>
