<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio Fahri · 2026</title>
<meta name="description" content="Portofolio digital: desain dan teknisi jaringan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&family=Oswald:wght@300;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================
   TOKEN WARNA (ubah di sini bila perlu)
   ===================================================== */
:root{
  --bg:#05070B;
  --navy:#06192E;
  --glow-navy:#0A3A5C;
  --accent:#1E90D6;
  --red:#C8102E;
  --silver-1:#E8EAEE;
  --silver-2:#8B9099;
  --text:#C9D1D9;
  --text-2:#8B94A1;
  --pill-on:#BFDDF5;
  --pill-on-text:#0B2A44;
  --pill-off-text:#AEB6C2;
  --line:rgba(255,255,255,.12);
  --radius:14px;
}

/* ---------- Reset & dasar ---------- */
*{box-sizing:border-box}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  background:var(--bg);color:var(--text);
  font-family:Montserrat,system-ui,sans-serif;font-size:14px;line-height:1.7;
}
img{max-width:100%;display:block}
button,a{font-family:inherit}
:focus-visible{outline:2px solid var(--pill-on);outline-offset:3px}

/* ---------- Lapisan latar global ---------- */
.bg-fixed{
  position:fixed;inset:0;z-index:-3;
  background:linear-gradient(180deg,var(--bg) 0%,var(--navy) 55%,var(--bg) 100%);
}
.circuit{
  position:fixed;inset:0;width:100%;height:100%;z-index:-2;
  opacity:.16;pointer-events:none;
}
.grain{
  position:fixed;inset:-50%;z-index:49;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  50%{transform:translate(-3%,2%)}
  100%{transform:translate(2%,-3%)}
}
.vignette{
  position:fixed;inset:0;z-index:48;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.78) 100%);
}

/* Glow biru di sudut tiap layar */
.glow{
  position:absolute;width:min(60vw,720px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0%,transparent 68%);
  opacity:.35;filter:blur(150px);pointer-events:none;z-index:-1;
}
.g-tl{top:-18%;left:-14%}
.g-br{bottom:-22%;right:-16%}

/* Kursor kustom (hanya perangkat dengan mouse) */
.cur-dot,.cur-ring{display:none;position:fixed;top:0;left:0;pointer-events:none;z-index:200;border-radius:50%;transform:translate(-50%,-50%)}
.cur-dot{width:6px;height:6px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.cur-ring{width:34px;height:34px;border:1px solid rgba(30,144,214,.75);transition:width .25s,height .25s,background .25s}
.has-cursor .cur-dot,.has-cursor .cur-ring{display:block}
.has-cursor, .has-cursor *{cursor:none}
.cur-ring.hover{width:52px;height:52px;background:rgba(30,144,214,.12)}

/* ---------- Layar (setiap bagian) ---------- */
.screen{
  position:relative;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:110px 7vw 80px;
  scroll-snap-align:start;isolation:isolate;overflow:hidden;
}

/* ---------- Navigasi atas ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:76px;z-index:60;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 4vw;pointer-events:none;
}
.logo{
  justify-self:start;pointer-events:auto;text-decoration:none;
  font:700 24px/1 Oswald,sans-serif;letter-spacing:2px;color:#fff;
  border:2px solid #fff;padding:6px 10px 5px;transform:skewX(-10deg);
}
.logo span{display:inline-block;transform:skewX(10deg)}
.pill-nav{
  position:relative;pointer-events:auto;display:flex;gap:0;
  padding:5px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.nav-ind{
  position:absolute;top:5px;bottom:5px;left:0;width:0;opacity:0;
  border-radius:999px;background:var(--pill-on);
  transition:left .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),opacity .3s;
}
.nav-btn{
  position:relative;z-index:1;border:0;background:none;cursor:pointer;
  color:var(--pill-off-text);font:600 12px/1 Montserrat,sans-serif;letter-spacing:1.5px;
  padding:11px 18px;border-radius:999px;transition:color .4s;
}
.nav-btn:hover{color:#fff}
.nav-btn.active{color:var(--pill-on-text)}

/* ---------- 1. SAMPUL (HERO) ---------- */
.hero{padding:0;justify-content:flex-start}
.arc-shape{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  height:min(74vh,700px);width:calc(min(74vh,700px) * 1.25); /* badan lurus di kiri, sisi kanan melengkung penuh (bentuk huruf D) */
  background:var(--red);
  border-radius:0 calc(min(74vh,700px) / 2) calc(min(74vh,700px) / 2) 0; /* sudut kanan melengkung setengah tinggi */
  box-shadow:0 30px 70px rgba(0,0,0,.55);
  z-index:1;
}
.arc-shape::after{ /* cahaya lembut di balik sosok */
  content:"";position:absolute;left:30%;top:25%;width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(30,144,214,.55),transparent 70%);
  filter:blur(40px);z-index:-1;
}
.hero-photo{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:118%;z-index:2;
}
.hero-photo img{
  height:100%;width:auto;
  filter:drop-shadow(0 25px 30px rgba(0,0,0,.65));
}
.hero-text{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  z-index:2;
}
/* Visual tengah sampul */
.hero-core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(62vw,720px);z-index:1;pointer-events:none;
}
.core-svg{width:100%;height:auto;display:block;overflow:visible}
.spin-group{transform-box:view-box;transform-origin:250px 200px;animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Judul: huruf naik satu per satu lalu berkilau pelan */
.judul-huruf{display:inline-flex;flex-wrap:nowrap}
.ch{
  display:inline-block;opacity:0;transform:translateY(70px);
  color:#D5DAE1;text-shadow:0 6px 0 rgba(0,0,0,.55);
}
.is-loaded .ch{
  animation:letterUp .9s cubic-bezier(.2,.7,.2,1) calc(var(--i) * .09s + .2s) forwards,
            glowPulse 3.5s ease-in-out calc(var(--i) * .09s + 1.4s) infinite;
}
@keyframes letterUp{to{opacity:1;transform:none}}
@keyframes glowPulse{
  0%,100%{text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 0 rgba(30,144,214,0)}
  50%{text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 28px rgba(30,144,214,.6)}
}
.hero-title{
  margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;
  font-size:clamp(70px,16vw,280px);line-height:.85;letter-spacing:4px;
  display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--silver-1) 0%,var(--silver-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(255,255,255,.25));
}
.year{
  font:300 clamp(26px,3vw,46px)/1 Oswald,sans-serif;color:var(--silver-2);
  margin:.18em 0 0 .35em;letter-spacing:2px;
  -webkit-text-fill-color:var(--silver-2);
}
.badge{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-top:26px;
  font:500 13px/1 Montserrat,sans-serif;letter-spacing:2px;color:#D7DEE8;
}
.badge i{width:14px;height:14px;background:#fff;border-radius:3px;display:inline-block}

.game-menu{
  position:absolute;left:50%;bottom:11vh;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;
}
.mi{
  position:relative;border:0;background:none;cursor:pointer;padding:6px 16px;
  font:600 clamp(16px,1.7vw,22px)/1.2 Oswald,sans-serif;letter-spacing:5px;
  color:#AEB6C2;transition:color .3s,text-shadow .3s;
}
.mi::before{
  content:"\25B6";position:absolute;left:-2px;top:50%;
  transform:translate(-100%,-50%);font-size:.6em;color:var(--pill-on);
  opacity:0;transition:opacity .3s,transform .3s;
}
.mi:hover,.mi:focus-visible{
  color:#fff;text-shadow:0 0 14px rgba(30,144,214,.9);
}
.mi:hover::before,.mi:focus-visible::before{opacity:1;transform:translate(-120%,-50%)}

/* ---------- 2. PROFIL ---------- */
.profil-grid{
  width:100%;max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);
  gap:6vw;align-items:center;position:relative;z-index:1;
}
.halo{margin:0;font:500 13px/1 Montserrat,sans-serif;letter-spacing:3px;color:var(--text-2)}
.nama{
  margin:12px 0 0;font:700 clamp(30px,3.6vw,54px)/1.05 Oswald,sans-serif;
  letter-spacing:1px;background:linear-gradient(180deg,var(--silver-1),var(--silver-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.profil-photo{
  position:relative;width:min(100%,460px);margin-top:28px;
}
.profil-photo .glow-soft{
  position:absolute;left:50%;top:40%;width:110%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(30,144,214,.55),transparent 68%);
  filter:blur(40px);z-index:0;
}
.profil-photo img{position:relative;z-index:1;width:100%;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.sparks{
  position:absolute;inset:-15% -10%;width:120%;height:130%;
  pointer-events:none;z-index:2;mix-blend-mode:screen;
}

.sub{
  margin:0 0 14px;font:600 clamp(15px,1.5vw,19px)/1.2 Oswald,sans-serif;
  letter-spacing:3px;color:#C9CED6;
}
.lead{margin:0;font-size:15px;line-height:1.85;color:var(--text)}
.profil-right{display:flex;flex-direction:column;gap:34px}
.apps{display:flex;flex-wrap:wrap;gap:16px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
.app-ic{
  width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(30,144,214,.22),rgba(255,255,255,.02));
  font:600 17px/1 Oswald,sans-serif;color:#fff;letter-spacing:1px;
  transition:transform .3s,box-shadow .3s;
}
.app-logo{width:36px;height:36px;display:block}
.app:hover .app-ic{transform:translateY(-4px);box-shadow:0 0 22px rgba(30,144,214,.55)}
.app small{font-size:11px;letter-spacing:1px;color:var(--text-2);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:13px;color:var(--text);background:rgba(255,255,255,.02);
  transition:transform .3s,box-shadow .3s;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(30,144,214,.4)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
  border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  background:rgba(255,255,255,.025);backdrop-filter:blur(6px);
  transition:transform .35s,box-shadow .35s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 0 26px rgba(30,144,214,.28)}
.card p{margin:0 0 6px}
.card ul{margin:6px 0 0;padding-left:18px}
.card li{margin:2px 0}
.muted{color:var(--text-2)}
.card-title{font:600 13px/1.4 Montserrat,sans-serif;letter-spacing:1px;color:var(--silver-1)}

.bar-row{margin-bottom:16px}
.bar-row:last-child{margin-bottom:0}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--text)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--pill-on));
  transition:width 1.4s cubic-bezier(.2,.8,.2,1);
}
.bar i.ph-bar{background:repeating-linear-gradient(45deg,rgba(191,221,245,.5) 0 6px,transparent 6px 12px)}
.in .bar i{width:var(--w)}

/* ---------- 3. PROJECT ---------- */
.judul-tengah{
  margin:0 0 36px;text-align:center;
  font:400 clamp(44px,7vw,96px)/.95 Anton,Impact,sans-serif;letter-spacing:2px;
  background:linear-gradient(180deg,var(--silver-1),var(--silver-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.55));
}
.bento{
  width:100%;max-width:1200px;margin:0 auto;position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(170px,22vh);gap:16px;
}
.tile{
  position:relative;padding:0;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:linear-gradient(145deg,#0b2740,#05070B);
  transition:transform .4s ease,box-shadow .4s ease;
  opacity:0;transform:translateY(24px);
}
.tile.in{opacity:1;transform:none;transition-delay:var(--d,0ms)}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 0 30px rgba(30,144,214,.35)}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile-ph{
  position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;
  font-size:12px;letter-spacing:1px;color:var(--pill-on);
}
.tile img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform 1.2s ease}
.tile:hover img{transform:scale(1.06)}
.ov{
  position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  padding:20px;text-align:left;
  background:linear-gradient(to top,rgba(5,7,11,.96),rgba(5,7,11,.35) 60%,transparent);
  opacity:0;transition:opacity .4s ease;
}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.t-jenis{font-size:11px;letter-spacing:1px;color:var(--pill-on);text-transform:uppercase}
.ov strong{font:600 22px/1.2 Oswald,sans-serif;letter-spacing:1px;color:#fff}
.ov small{color:var(--text-2);font-size:12px}
.btn-mini{
  align-self:flex-start;margin-top:8px;padding:8px 14px;border-radius:999px;
  border:1px solid rgba(191,221,245,.6);color:#fff;font-size:12px;letter-spacing:1px;
}

/* Modal detail project */
.modal{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;
  background:rgba(3,5,8,.82);backdrop-filter:blur(6px);
}
.modal.open{display:grid;animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  position:relative;width:min(920px,100%);max-height:90vh;overflow:auto;
  display:grid;grid-template-columns:1.2fr 1fr;
  background:#070D16;border:1px solid var(--line);border-radius:16px;
}
.modal-img{min-height:300px;background:linear-gradient(145deg,#0b2740,#05070B);display:grid;place-items:center;position:relative}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-img .ph-big{padding:20px;text-align:center;color:var(--pill-on);font-size:13px}
.modal-txt{padding:28px 26px}
.m-jenis{margin:0 0 6px;font-size:11px;letter-spacing:1px;color:var(--pill-on);text-transform:uppercase}
.modal-txt h3{margin:0 0 6px;font:600 30px/1.1 Oswald,sans-serif;letter-spacing:1px;color:var(--silver-1)}
.m-tahun{margin:0 0 16px;font-size:12px;color:var(--text-2)}
.modal-close{
  position:absolute;top:10px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:rgba(5,7,11,.7);color:#fff;font-size:20px;cursor:pointer;
}
.modal-close:hover{box-shadow:0 0 16px rgba(30,144,214,.6)}

/* ---------- 4. KONTAK ---------- */
.kontak-grid{
  position:relative;z-index:1;width:100%;max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4vw;align-items:center;
}
.kontak-left{position:relative}
.photo-wrap{position:relative;width:min(300px,70vw);margin-top:20px}
.circle{
  width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 0 40px rgba(30,144,214,.25);
}
.circle img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.socials{position:absolute;inset:0;pointer-events:none}
.soc{
  position:absolute;pointer-events:auto;display:flex;align-items:center;gap:10px;
  transform:translate(-50%,-50%);text-decoration:none;color:var(--text);white-space:nowrap;
}
.soc-ic{
  width:50px;height:50px;border-radius:50%;background:#fff;color:#0B2A44;
  display:grid;place-items:center;font-size:22px;line-height:1;
  box-shadow:0 0 0 rgba(30,144,214,0);transition:transform .3s,box-shadow .3s;
}
.soc:hover .soc-ic,.soc:focus-visible .soc-ic{transform:translateY(-3px) scale(1.06);box-shadow:0 0 22px rgba(30,144,214,.8)}
.soc-h{font-size:13px;color:var(--text)}
.nama-bawah{margin:18px 0 0;font:600 18px/1.3 Montserrat,sans-serif;color:var(--silver-1)}

.kontak-right{position:relative;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.besar{
  margin:0;font:700 clamp(54px,8.5vw,140px)/.84 Oswald,sans-serif;text-transform:uppercase;
  color:rgba(139,144,153,.42);letter-spacing:1px;
}
.tahun-besar{font-weight:300;color:rgba(139,144,153,.3);margin-top:-.05em}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;position:relative;z-index:2}
.btn{
  display:inline-block;padding:13px 22px;border-radius:12px;text-decoration:none;
  border:1px solid rgba(191,221,245,.5);background:rgba(255,255,255,.04);color:#fff;
  font:600 13px/1 Montserrat,sans-serif;letter-spacing:1px;
  transition:transform .25s,box-shadow .25s,background .25s;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 24px rgba(30,144,214,.6)}
.btn.solid{background:var(--pill-on);color:var(--pill-on-text);border-color:transparent}
.decor{
  position:absolute;right:0;bottom:4vh;width:min(400px,46vw);height:auto;opacity:.9;pointer-events:none;z-index:0;
}
.foot{
  position:relative;z-index:1;margin-top:auto;padding-top:60px;text-align:center;
  font-size:12px;letter-spacing:1px;color:var(--text-2);
}

/* ---------- Animasi masuk ---------- */
.anim,.anim-l{opacity:0}
.is-loaded .anim{animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.is-loaded .anim-l{animation:slideR 1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}

.rv{opacity:0;transform:translateY(30px);transition:opacity .75s ease-out,transform .75s ease-out;transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

/* Hover umum */
.hover-lift{transition:transform .3s,box-shadow .3s}

/* ---------- Responsif: tablet ---------- */
@media (max-width:1000px){
  .arc-shape{height:62vh;width:calc(62vh * 1.25);border-radius:0 31vh 31vh 0}
  .hero-title{font-size:clamp(60px,15vw,200px)}
  .profil-grid{grid-template-columns:1fr;gap:40px}
  .profil-photo{margin-inline:auto}
  .kontak-grid{grid-template-columns:1fr;gap:50px}
  .kontak-right{min-height:auto}
  .decor{width:min(340px,50vw);opacity:.6}
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(170px,28vh)}
  .tile.big{grid-column:span 2;grid-row:span 1}
}

/* ---------- Responsif: HP ---------- */
@media (max-width:700px){
  .screen{padding:96px 16px 110px}
  .topbar{height:auto;grid-template-columns:1fr;padding:16px 16px 0;justify-items:start}

/* ---------- Utilitas ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Escape teks lalu bungkus [kurung] sebagai placeholder
const txt = s => esc(s).replace(/\[([^\]]*)\]/g, '<span class="ph">[$1]</span>');

/* ---------- Render isi dari DATA ---------- */

  $("#software").innerHTML = DATA.software.map((s, i) => `

      </span>
      <small>${txt(s.nama)}</small>

  $("#jaringan").innerHTML = DATA.jaringan
    .map((j, i) => `<span class="chip rv" style="--d:${i * 70}ms">${txt(j)}</span>`).join("");

  const p = DATA.pendidikan;
  $("#pendidikan").innerHTML = `
    <p class="card-title">${txt(p.masuk)} - ${txt(p.lulus)}</p>
    <p>${txt(p.sekolah)}</p>
    <p class="muted">${txt(p.jurusan)}</p>`;

  const e = DATA.pengalaman;
  $("#pengalaman").innerHTML = `

    <p class="muted">${txt(e.waktu)}</p>
    <ul>${e.poin.map(x => `<li>${txt(x)}</li>`).join("")}</ul>`;

  $("#softskill").innerHTML = DATA.softskill
    .map((s, i) => `<span class="chip rv" style="--d:${i * 70}ms">${txt(s)}</span>`).join("");

  $("#bento").innerHTML = DATA.projects.map((p, i) => `
    <button class="tile ${p.size}" data-i="${i}" style="--d:${i * 90}ms" aria-label="Lihat detail ${esc(p.judul)}">
      <span class="tile-ph">${txt("[Gambar: " + p.judul + "]")}</span>
      ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.judul)}" loading="lazy" onerror="this.remove()">` : ""}
      <span class="ov">
        <span class="t-jenis">${txt(p.jenis)}</span>
        <strong>${txt(p.judul)}</strong>
        <small>${txt(p.tahun)}</small>
        <span class="btn-mini">Lihat Detail</span>
      </span>
    </button>`).join("");

  // Posisi ikon sosial melengkung di sisi kanan foto (persen dari kotak foto)
  // Ikon tersebar melengkung dari -35° sampai 35° sesuai jumlah kontak
  const n = DATA.kontak.length, R = 52;
  $("#socials").innerHTML = DATA.kontak.map((k, i) => {
    const deg = n === 1 ? 0 : -35 + i * (70 / (n - 1));
    const a = deg * Math.PI / 180;
    const x = 50 + R * Math.cos(a), y = 50 + R * Math.sin(a);
    return `<a class="soc" href="${esc(k.link)}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" aria-label="${esc(k.nama)}">
      <span class="soc-ic" aria-hidden="true"><i class="${esc(k.ikon)}"></i></span>
      <span class="soc-h">${txt(k.handle)}</span>
    </a>`;
  }).join("");

  $("#cta").innerHTML = `
    <a class="btn solid" href="${esc(DATA.tombol.cv)}">Unduh CV</a>
    <a class="btn" href="${esc(DATA.tombol.sertifikat)}">Lihat Sertifikat PKL</a>`;
}

/* ---------- Navigasi & indikator pil ---------- */
const ind = $("#nav-ind");
function moveIndicator(btn) {
  if (!btn) { ind.style.opacity = 0; return; }
  ind.style.opacity = 1;
  ind.style.left = btn.offsetLeft + "px";
  ind.style.width = btn.offsetWidth + "px";
}
function setActive(id) {
  const btn = $(`.nav-btn[data-go="${id}"]`);
  $$(".nav-btn").forEach(b => b.classList.toggle("active", b === btn));
  moveIndicator(btn);
}
function goTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (!go) return;
  e.preventDefault();
  if (go.hasAttribute("data-exit")) {
    // KELUAR: kembali ke sampul
    goTo("mulai");
    return;
  }
  goTo(go.dataset.go);
});
// Tab aktif mengikuti bagian yang sedang terlihat
const navIO = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) setActive(en.target.id); });
}, { threshold: 0.5 });
["profil", "project", "kontak"].forEach(id => navIO.observe(document.getElementById(id)));
$("#mulai") && new IntersectionObserver(en => {
  if (en[0].isIntersecting) setActive("none");
}, { threshold: 0.6 }).observe($("#mulai"));
window.addEventListener("resize", () => {
  const act = $(".nav-btn.active");
  moveIndicator(act);
});

/* ---------- Animasi muncul saat di-scroll ---------- */
const revealIO = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); revealIO.unobserve(en.target); }
  });
}, { threshold: 0.15 });

/* ---------- Percikan api di sekitar foto profil ---------- */
function startSparks(canvas) {
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const parts = [];
  let W = 0, H = 0, running = false, raf = 0;

  function size() {
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn() {
    parts.push({
      x: W * (0.2 + Math.random() * 0.6),
      y: H * (0.6 + Math.random() * 0.35),
      vx: (Math.random() - 0.5) * 0.25,
      vy: -(0.25 + Math.random() * 0.6),
      r: 0.8 + Math.random() * 1.9,
      life: 0,
      max: 120 + Math.random() * 120,
      warm: Math.random(),
    });
  }
  function frame() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    if (parts.length < 36 && Math.random() < 0.45) spawn();
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life++;
      p.x += p.vx + Math.sin((p.life + i) * 0.05) * 0.15;
      p.y += p.vy;
      const t = p.life / p.max;
      if (t >= 1) { parts.splice(i, 1); continue; }
      const alpha = (1 - t) * (0.5 + 0.5 * Math.sin(p.life * 0.3));
      const color = p.warm < 0.7
        ? `255,${Math.floor(120 + p.warm * 80)},40`   // oranye
        : `200,16,46`;                                  // merah
      ctx.beginPath();
      ctx.fillStyle = `rgba(${color},${alpha})`;
      ctx.arc(p.x, p.y, p.r * (1 - t * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  // Hanya berjalan saat terlihat supaya ringan
  new IntersectionObserver(en => {
    if (en[0].isIntersecting && !running) { running = true; frame(); }
    else if (!en[0].isIntersecting) { running = false; cancelAnimationFrame(raf); }
  }).observe(canvas);
  new ResizeObserver(size).observe(canvas);
  size();
}

/* ---------- Modal detail project ---------- */
const modal = $("#modal");
let lastFocus = null;
function openModal(p) {
  $("#m-img").innerHTML = p.img
    ? `<img src="${esc(p.img)}" alt="${esc(p.judul)}" onerror="this.remove()">`
    : `<div class="ph-big">${txt("[Gambar besar: " + p.judul + "]")}</div>`;
  $("#m-jenis").innerHTML = txt(p.jenis);
  $("#m-judul").innerHTML = txt(p.judul);
  $("#m-tahun").innerHTML = txt(p.tahun);
  $("#m-desc").innerHTML = txt(p.deskripsi);
  lastFocus = document.activeElement;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  $("#modal-close").focus();
}
function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  if (lastFocus) lastFocus.focus();
}
$("#bento").addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) openModal(DATA.projects[+t.dataset.i]);
});
$("#modal-close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

/* ---------- Kursor kustom ---------- */
if (window.matchMedia("(pointer:fine)").matches) {
  document.body.classList.add("has-cursor");
  const dot = $("#cur-dot"), ring = $("#cur-ring");
  let mx = 0, my = 0, rx = 0, ry = 0;
  window.addEventListener("mousemove", e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + "px"; dot.style.top = my + "px";
  });
  (function loop() {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    ring.style.left = rx + "px"; ring.style.top = ry + "px";
    requestAnimationFrame(loop);
  })();
  document.addEventListener("mouseover", e => {
    ring.classList.toggle("hover", !!e.target.closest("a,button,.tile,.chip,.app"));
  });
}

requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("is-loaded")));
setTimeout(() => setActive("none"), 0);
